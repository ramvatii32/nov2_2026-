name: myworkflow1
on:
  push:
    branches:
      - nidhibranch
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
       - name: mystep1
         run: |
              cat /etc/os-release
              docker --version
              docker compose version
       - name: mystep2-clone the repo in the current directory
         uses: actions/checkout@v4
       - name: mystep3-check the source code
         run: ls -al
       - name: mystep4-build docker image
         run:  docker image build -t ramvatii32/myimage_nov2:t${{ github.run_number }} -f Dockerfile . 
       - name: mystep5-check the docker images
         run: docker images
       - name: mystep6-login to dockerhub
         uses: docker/login-action@v3
         with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}
       - name: mystep7-push the docker image
         run: docker image push ramvatii32/myimage_nov2:t${{ github.run_number }}

