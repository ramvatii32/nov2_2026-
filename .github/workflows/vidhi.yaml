name: myworkflow1
on:
  push:
    branches:
      - nidhibranch
jobs:
  myjob1:
    runs-on: ubuntu-latest
    steps:
       - name: mystep1
         run: |
              cat /etc/os-release
              docker --version
              docker compose version
       - name: mystep2-clone the repo in the current directory
         uses: actions/checkout@v4
       - name: mystep3-check the source code
         run: ls -al
       - name: mystep4-build docker image
         run:  docker image build -t ramvatii32/myimage_nov2:t1 -f Dockerfile . 
       
